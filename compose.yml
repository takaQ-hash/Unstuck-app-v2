# 開発用のcompose。リポジトリのルートで docker compose up -d を実行する
# 使い方は CLAUDE.md の「開発用のDB・Redis（compose）」を参照する
name: unstuck

services:
  postgres:
    # メジャーバージョンを固定する（scripts/backend-rspec.sh と同じ版）
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env.example を .env にコピーして、値を入れてください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.example を .env にコピーして、値を入れてください}
    ports:
      # ホストからだけ接続できるようにする（LANには公開しない）
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 のデータは /var/lib/postgresql/18/docker に置かれるため、親に付ける
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # メジャーバージョンを固定する
    image: redis:8
    ports:
      # ホストからだけ接続できるようにする（LANには公開しない）
      - "127.0.0.1:6379:6379"
    # データは残さない（ジョブの予約の扱いは、Sidekiqの導入時に決める）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      # backend だけをマウントする（ルートの .env をコンテナに見せない）
      - ./backend:/app/backend
      # gem の置き場所。docker run 用の unstuck_bundle（root の持ち物）とは分ける
      - backend_bundle:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # パスワードは .env から compose が埋める。DB名は database.yml の development と同じ
      DATABASE_URL: postgres://${POSTGRES_USER:?.env.example を .env にコピーして、値を入れてください}:${POSTGRES_PASSWORD:?.env.example を .env にコピーして、値を入れてください}@postgres:5432/backend_development
      REDIS_URL: redis://redis:6379/0
    command: bash -c 'bundle install && rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails s -b 0.0.0.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  backend_bundle:
